name: Actualización Semanal Automática de Datos (Sábados 11:00 AM ARG)

on:
  schedule:
    # 11:00 AM Argentina (UTC-3) corresponde a 14:00 UTC los días sábados
    - cron: '0 14 * * 6'
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions de GitHub

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Chequeo y Actualización de Fuentes Oficiales
        run: |
          python auto_weekly_check_and_update.py

      - name: Recompilar Dataset Maestro e index.html
        run: |
          python actualizar_demografia.py

      - name: Commit y Push de Cambios Automáticos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_dataset_demografia.json index.html registro_actualizaciones_fuentes.json || true
          if git diff --staged --quiet; then
            echo "No se detectaron cambios en los datos esta semana."
          else
            git commit -m "Auto-update: Actualización automática semanal de datos [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
